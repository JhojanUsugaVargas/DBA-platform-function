apiVersion: apps/v1
kind: Deployment
metadata:
  name: datacheck-web
  namespace: datacheck-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datacheck-web
  template:
    metadata:
      labels:
        app: datacheck-web
    spec:
      containers:
        - name: datacheck-web
          image: datacheck-web:v9
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: datacheck-config
                  key: PORT
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: datacheck-config
                  key: APP_NAME
            - name: DB_SCHEMA
              valueFrom:
                configMapKeyRef:
                  name: datacheck-config
                  key: DB_SCHEMA
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: datacheck-config
                  key: CORS_ORIGINS
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: datacheck-secrets
                  key: SECRET_KEY
            - name: FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: datacheck-secrets
                  key: FERNET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: datacheck-secrets
                  key: DATABASE_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datacheck-secrets
                  key: GEMINI_API_KEY
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: datacheck-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: datacheck-secrets
                  key: SMTP_PASSWORD
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          imagePullPolicy: IfNotPresent
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600