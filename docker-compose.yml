version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datacheck-backend
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+pg8000://postgres:postgres@db:5432/dba_platform_function}
      - SECRET_KEY=${SECRET_KEY:-datacheck-insecure-secret-key-change-me}
      - FERNET_KEY=${FERNET_KEY:-u275j75GZ7XN9Lh3t_tL05iZz-5hO7pY-o28pZkU7_o=}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - CORS_ORIGINS=http://localhost:4200,http://127.0.0.1:4200,http://localhost:8005,http://127.0.0.1:8005
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datacheck-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

  db:
    image: postgres:15-alpine
    container_name: datacheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-dba_platform_function}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
